[project]
name = "dvr-timestamp-indexer"
version = "0.1.0"
description = "Create a CSV index of Xiaomi DVR videos using their embedded timestamp overlay."
requires-python = ">=3.11"
dependencies = [
    "av>=15.1,<16",
    "pillow>=11.3,<12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
dvr-timestamp-index = "dvr_timestamp_indexer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
